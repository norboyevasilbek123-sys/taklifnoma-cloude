<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To‘y taklifnomasi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7b2f34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Great+Vibes&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app" hidden>

  <!-- 1-ekran: yopiq konvert -->
  <section id="stage" class="stage">
    <p class="kicker" id="kicker"></p>
    <h1 class="names" id="names"></h1>
    <p class="hint" id="hint"></p>

    <div class="env-wrap">
      <div class="env" id="env">
        <div class="env-back"></div>
        <div class="letter" aria-hidden="true">
          <p class="l-kicker" id="l-kicker"></p>
          <p class="l-names" id="l-names"></p>
        </div>
        <div class="env-left"></div>
        <div class="env-right"></div>
        <div class="env-bottom"></div>
        <div class="flap"></div>
        <div class="gul" id="gul" aria-hidden="true"></div>
        <div class="seal-wrap">
          <button class="seal" id="seal" type="button" aria-label="Taklifnomani ochish"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 2-ekran: ochilgan taklifnoma -->
  <article id="card" class="card-view" hidden></article>

  <button id="music" class="music" type="button" hidden aria-label="Musiqani yoqish yoki o‘chirish"></button>
</main>

<p id="error" class="error" hidden>Taklifnoma topilmadi. Havolani tekshiring.</p>
<noscript><p class="error" style="display:block">Taklifnomani ko‘rish uchun JavaScript yoqilgan bo‘lishi kerak.</p></noscript>

<script src="app.js"></script>
</body>
</html>
